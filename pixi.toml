[workspace]
authors = ["Ray <iinoshirozheng@gmail.com>"]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "fire-cube"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
cube = "mojo run src/cube.mojo"
build = "mkdir -p dist && mojo build src/cube.mojo -o dist/fire-cube"

[dependencies]
mojo = ">=1.0.0,<2"
